<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Studio — Edwin Gyasi Owusu</title>

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!--
    Absolute, host-relative path to the config.

    Without this, Decap resolves the bare string "config.yml" against the
    document base URL. Vercel serves this page at BOTH /admin and /admin/,
    and on the no-trailing-slash variant the base is /admin, so "config.yml"
    resolves to /config.yml at the site root and 404s. Visiting
    edwingyasi.online/admin redirects to www.edwingyasi.online/admin with no
    trailing slash, so that was the path everyone actually hit.

    A leading slash pins it to /admin/config.yml regardless of trailing slash,
    and still works on any host: apex, www, or a *.vercel.app preview.
  -->
  <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    /* ================================================================
       Studio theme for Decap CMS.

       Every value below is lifted from the :root block of index.html so
       the panel reads as one more room in the same building. Light only.

       Decap renders through emotion, and its generated class names keep a
       readable component label on the end (…-AppHeader, …-Card). Matching
       on that suffix is the stable way to reach the internals.
       ================================================================ */

    :root {
      --bg:           #FAFAF8;
      --bg-elev:      #FFFFFF;
      --bg-tint:      #F3F1EB;
      --ink:          #1C1C1C;
      --ink-soft:     #3D3D3D;
      --ink-mute:     #666666;
      --ink-faint:    #A8A8A8;
      --emerald:      #0F766E;
      --emerald-hi:   #14867D;
      --emerald-deep: #0A5952;
      --emerald-soft: rgba(15, 118, 110, 0.08);
      --emerald-tint: #E8F2F0;
      --gold:         #C89B3C;
      --gold-hi:      #D8AB4C;
      --gold-deep:    #A17F30;
      --gold-soft:    rgba(200, 155, 60, 0.12);
      --gold-tint:    #F7EFD9;
      --line:         rgba(28, 28, 28, 0.10);
      --line-soft:    rgba(28, 28, 28, 0.06);
      --font-heading: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-body:    'Inter', system-ui, -apple-system, sans-serif;
      --radius:       16px;
      --radius-sm:    10px;
      --ease:         cubic-bezier(0.22, 0.61, 0.36, 1);
      --bar:          58px;
    }

    html, body {
      background: var(--bg) !important;
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    /* Clear the fixed brand bar. Decap's own header is sticky, so it is
       pushed down by the same amount rather than sliding underneath. */
    body { padding-top: var(--bar) !important; }

    ::selection { background: var(--emerald); color: #fff; }

    * { scrollbar-color: rgba(28,28,28,.22) transparent; scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 11px; height: 11px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: rgba(28,28,28,.18);
      border: 3px solid var(--bg);
      border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover { background: var(--emerald); }

    /* ---------------------------------------------------------------
       BRAND BAR

       Decap has no slot for a wordmark, so this sits above the whole app
       as its own element. The mark is the same "E" as the favicon and the
       wordmark matches .brand on index.html: Plus Jakarta Sans 700.
       --------------------------------------------------------------- */
    .ega-brand {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--bar);
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0 1.6rem;
      background: rgba(250, 250, 248, 0.85);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--line-soft);
    }
    /* The bar has to outrank Decap's own sticky header, which puts it above
       the modal layer too. react-modal stamps this class on <body> while any
       modal is open, so the bar steps aside for the media library instead of
       painting its "View site" icon over the top of it. Hiding a fixed
       element costs no layout shift, the body padding-top stays put. */
    body.ReactModal__Body--open .ega-brand { display: none !important; }
    .ega-brand__mark { width: 26px; height: 26px; display: block; border-radius: 6px; }
    .ega-brand__word {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    .ega-brand__rule { width: 1px; height: 20px; background: var(--line); }
    .ega-brand__meta {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--emerald);
      white-space: nowrap;
    }
    .ega-brand__spacer { flex: 1; }
    .ega-brand__link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink-soft);
      text-decoration: none;
      transition: all 0.25s var(--ease);
    }
    .ega-brand__link:hover {
      border-color: var(--emerald);
      color: var(--emerald);
      background: var(--emerald-soft);
    }
    @media (max-width: 720px) {
      .ega-brand__rule, .ega-brand__meta { display: none; }
      .ega-brand__word { font-size: 0.95rem; }
    }

    /* ---------------------------------------------------------------
       LOGIN
       --------------------------------------------------------------- */
    [class*="-StyledAuthenticationPage"] {
      background:
        radial-gradient(760px 480px at 50% 0%, var(--emerald-soft), transparent 70%),
        var(--bg) !important;
      position: relative;
    }
    /* Hairline grid, the same device the hero uses behind the headline. */
    [class*="-StyledAuthenticationPage"]::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(28,28,28,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28,28,28,.028) 1px, transparent 1px);
      background-size: 72px 72px;
      pointer-events: none;
    }
    [class*="-StyledAuthenticationPage"] > * { position: relative; z-index: 1; }

    /* Decap's stock logo slot: the brand bar above already carries the mark. */
    [class*="-PageLogoIcon"],
    [class*="-CustomLogoIcon"] { display: none !important; }

    [class*="-StyledAuthenticationPage"]::after {
      content: "Sign in to edit the site";
      position: absolute;
      top: calc(50% - 116px);
      left: 0; right: 0;
      text-align: center;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.025em;
      color: var(--ink);
      z-index: 2;
    }

    [class*="-LoginButton"],
    [class*="-StyledAuthenticationPage"] button {
      background: var(--emerald) !important;
      color: #fff !important;
      font-family: var(--font-body) !important;
      font-weight: 500 !important;
      font-size: 0.95rem !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      border: 1px solid var(--emerald) !important;
      border-radius: 999px !important;
      padding: 0.95rem 1.9rem !important;
      box-shadow: none !important;
      transition: all 0.3s var(--ease) !important;
    }
    [class*="-LoginButton"]:hover,
    [class*="-StyledAuthenticationPage"] button:hover {
      background: var(--emerald-hi) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15,118,110,0.25) !important;
    }

    /* ---------------------------------------------------------------
       CHROME — header, sidebar, shell
       --------------------------------------------------------------- */
    [class*="-AppHeader"] {
      top: var(--bar) !important;
      background: var(--bg-elev) !important;
      border-bottom: 1px solid var(--line-soft) !important;
      box-shadow: none !important;
    }
    [class*="-AppHeader"] a,
    [class*="-AppHeader"] button,
    [class*="-AppHeaderButton"] {
      color: var(--ink-mute) !important;
      font-family: var(--font-body) !important;
      font-size: 0.88rem !important;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      border-radius: 999px !important;
      background: transparent !important;
      transition: all 0.25s var(--ease) !important;
    }
    [class*="-AppHeader"] a:hover,
    [class*="-AppHeaderButton"]:hover {
      color: var(--emerald) !important;
      background: var(--emerald-soft) !important;
    }
    [class*="-AppHeaderActions"] [class*="-AppHeaderButton"][class*="active"] {
      color: var(--emerald) !important;
      background: var(--emerald-soft) !important;
    }
    /* The "New" / quick-create control reads as the one primary action. */
    [class*="-AppHeaderActions"] [class*="-AppHeaderNewEntryButton"],
    [class*="-AppHeader"] [class*="-DropdownButton"] {
      background: var(--ink) !important;
      color: var(--bg) !important;
      border-radius: 999px !important;
      padding: 0.55rem 1.05rem !important;
    }
    [class*="-AppHeaderActions"] [class*="-AppHeaderNewEntryButton"]:hover,
    [class*="-AppHeader"] [class*="-DropdownButton"]:hover {
      background: var(--emerald) !important;
      color: #fff !important;
    }

    [class*="-AppMainContainer"],
    [class*="-AppContainer"] { background: var(--bg) !important; }

    [class*="-SidebarContainer"] {
      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 1px 2px rgba(28,28,28,0.03) !important;
      padding: 0.5rem !important;
    }
    [class*="-SidebarHeading"] {
      font-family: var(--font-body) !important;
      font-size: 0.75rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.06em !important;
      text-transform: uppercase !important;
      color: var(--emerald) !important;
      display: flex !important;
      align-items: center !important;
      gap: 0.5rem !important;
    }
    /* The 24px rule that precedes every section eyebrow on the live site. */
    [class*="-SidebarHeading"]::before {
      content: "";
      width: 24px;
      height: 1px;
      background: var(--emerald);
      flex: none;
    }
    [class*="-SidebarNavLink"] {
      color: var(--ink-soft) !important;
      font-family: var(--font-body) !important;
      font-size: 0.92rem !important;
      font-weight: 500 !important;
      border-radius: var(--radius-sm) !important;
      border-left: 0 !important;
      margin: 2px 0 !important;
      transition: all 0.25s var(--ease) !important;
    }
    [class*="-SidebarNavLink"]:hover {
      color: var(--ink) !important;
      background: var(--bg-tint) !important;
    }
    [class*="-SidebarNavLink"][class*="active"],
    [class*="-SidebarNavLink"].active {
      color: var(--emerald-deep) !important;
      background: var(--emerald-tint) !important;
    }
    [class*="-SidebarNavLink"] svg { color: currentColor !important; }

    /* ---------------------------------------------------------------
       COLLECTION VIEW
       --------------------------------------------------------------- */
    [class*="-CollectionTop"],
    [class*="-CollectionHeader"] {
      background: transparent !important;
      box-shadow: none !important;
    }
    [class*="-CollectionTopHeading"],
    [class*="-CollectionTop"] h1 {
      font-family: var(--font-heading) !important;
      font-weight: 700 !important;
      font-size: 2rem !important;
      letter-spacing: -0.025em !important;
      color: var(--ink) !important;
    }
    [class*="-CollectionTopDescription"],
    [class*="-CollectionTop"] p {
      color: var(--ink-mute) !important;
      font-size: 1rem !important;
      line-height: 1.6 !important;
    }

    /* `-Card` is a substring of every card sub-component Decap emits
       (-CardHeading, -CardBody, -CardImage, …), so an unqualified
       [class*="-Card"] nests the whole card treatment inside the card. The
       exclusions keep the chrome on the outer card only. */
    [class*="-Card"]:not([class*="-CardHeading"]):not([class*="-CardBody"]):not([class*="-CardImage"]):not([class*="-CardFooter"]):not([class*="-CardLink"]),
    [class*="-ListCard"],
    [class*="-EntryCard"] {
      position: relative !important;
      overflow: hidden !important;
      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      box-shadow: none !important;
      transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease) !important;
    }
    /* The emerald-to-gold hairline that wipes across every project card. */
    [class*="-Card"]:not([class*="-CardHeading"]):not([class*="-CardBody"]):not([class*="-CardImage"]):not([class*="-CardFooter"]):not([class*="-CardLink"])::before,
    [class*="-ListCard"]::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--emerald), var(--gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.45s var(--ease);
      z-index: 2;
    }
    [class*="-Card"]:not([class*="-CardHeading"]):not([class*="-CardBody"]):not([class*="-CardImage"]):not([class*="-CardFooter"]):not([class*="-CardLink"]):hover::before,
    [class*="-ListCard"]:hover::before { transform: scaleX(1); }
    [class*="-Card"]:not([class*="-CardHeading"]):not([class*="-CardBody"]):not([class*="-CardImage"]):not([class*="-CardFooter"]):not([class*="-CardLink"]):hover,
    [class*="-ListCard"]:hover {
      border-color: rgba(15,118,110,0.35) !important;
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(28,28,28,0.07) !important;
    }
    [class*="-CardHeading"] a,
    [class*="-ListCardLink"] {
      font-family: var(--font-heading) !important;
      font-weight: 700 !important;
      color: var(--ink) !important;
      font-size: 1.15rem !important;
      letter-spacing: -0.015em !important;
    }
    [class*="-CardHeading"] a:hover,
    [class*="-ListCardLink"]:hover { color: var(--emerald) !important; }

    /* ---------------------------------------------------------------
       EDITOR
       --------------------------------------------------------------- */
    [class*="-EditorContainer"],
    [class*="-EditorContent"] { background: var(--bg) !important; }

    [class*="-EditorControlBar"],
    [class*="-ToolbarContainer"] {
      background: var(--bg-elev) !important;
      border-bottom: 1px solid var(--line-soft) !important;
      box-shadow: none !important;
    }
    [class*="-ToolbarSectionMain"] h1,
    [class*="-ToolbarSubSectionFirst"] {
      font-family: var(--font-heading) !important;
      color: var(--ink) !important;
    }

    [class*="-ControlPaneContainer"] {
      background: var(--bg) !important;
      border-color: var(--line) !important;
    }
    [class*="-PreviewPaneContainer"] {
      background: var(--bg-tint) !important;
      border-color: var(--line) !important;
    }
    [class*="-PreviewPaneFrame"] { background: var(--bg) !important; }

    /* Each field sits on its own card so the form has real structure
       instead of running together as one column of inputs. */
    [class*="-ControlContainer"] {
      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      padding: 1.05rem 1.15rem 1.15rem !important;
      margin-bottom: 1rem !important;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease) !important;
    }
    [class*="-ControlContainer"]:focus-within {
      border-color: rgba(15,118,110,0.4) !important;
      box-shadow: 0 0 0 3px var(--emerald-soft) !important;
    }

    [class*="-FieldLabel"],
    [class*="-ControlContainer"] > label {
      font-family: var(--font-body) !important;
      font-size: 0.78rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.06em !important;
      text-transform: uppercase !important;
      color: var(--emerald) !important;
      background: transparent !important;
      padding: 0 !important;
      position: static !important;
      display: block !important;
      margin-bottom: 0.55rem !important;
    }
    [class*="-FieldLabel"][class*="active"] { color: var(--emerald) !important; }
    [class*="-FieldHint"],
    [class*="-ControlHint"] {
      font-size: 0.82rem !important;
      color: var(--ink-mute) !important;
      font-style: normal !important;
      line-height: 1.5 !important;
    }
    [class*="-ControlHint"][class*="error"] { color: #B4553F !important; }

    /* Inputs */
    [class*="-ControlContainer"] input,
    [class*="-ControlContainer"] textarea,
    [class*="-widget"] input,
    [class*="-widget"] textarea,
    input[type="text"],
    input[type="url"],
    input[type="email"],
    input[type="number"],
    textarea {
      background: var(--bg) !important;
      color: var(--ink) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      padding: 0.7rem 0.85rem !important;
      font-family: var(--font-body) !important;
      font-size: 0.95rem !important;
      line-height: 1.55 !important;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease) !important;
    }
    input:focus, textarea:focus {
      background: var(--bg-elev) !important;
      border-color: var(--emerald) !important;
      box-shadow: 0 0 0 3px var(--emerald-soft) !important;
      outline: none !important;
    }
    ::placeholder { color: var(--ink-faint) !important; }

    /* Select / relation menus */
    [class*="-control"][class*="css-"],
    [class*="-ReactSelect"] [class*="control"] {
      background: var(--bg) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      min-height: 42px !important;
    }
    [class*="-menu"][class*="css-"] {
      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      box-shadow: 0 12px 32px rgba(28,28,28,0.10) !important;
      overflow: hidden !important;
    }
    [class*="-option"][class*="css-"] { color: var(--ink) !important; }
    [class*="-option"][class*="css-"]:hover { background: var(--emerald-tint) !important; }

    /* Object and list shells */
    [class*="-ObjectControl"],
    [class*="-ListControl"],
    [class*="-ObjectWidgetTopBar"],
    [class*="-StyledListItem"],
    [class*="-NestedObjectLabel"] {
      background: var(--bg-tint) !important;
      border-color: var(--line) !important;
      border-radius: var(--radius-sm) !important;
      color: var(--ink) !important;
    }
    [class*="-StyledListItem"] {
      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      margin-bottom: 0.6rem !important;
    }
    [class*="-NestedObjectLabel"] {
      font-family: var(--font-heading) !important;
      font-weight: 600 !important;
      color: var(--ink) !important;
      background: transparent !important;
    }
    [class*="-TopBarButton"],
    [class*="-ExpandButton"] { color: var(--ink-mute) !important; }
    [class*="-TopBarButton"]:hover { color: var(--emerald) !important; }
    [class*="-DragHandle"] { color: var(--ink-faint) !important; }

    /* "Add Stat", "Add Project", every list-append control */
    [class*="-AddButton"],
    [class*="-ListControl"] button[class*="-Add"] {
      background: var(--emerald-soft) !important;
      color: var(--emerald-deep) !important;
      border: 1px solid rgba(15,118,110,0.22) !important;
      border-radius: 999px !important;
      font-family: var(--font-body) !important;
      font-size: 0.88rem !important;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      padding: 0.6rem 1.15rem !important;
      box-shadow: none !important;
      transition: all 0.25s var(--ease) !important;
    }
    [class*="-AddButton"]:hover {
      background: var(--emerald) !important;
      color: #fff !important;
      border-color: var(--emerald) !important;
      transform: translateY(-2px);
    }

    /* Markdown editor.

       `-ToolbarContainer` is the editor's top control bar and it contains
       the substring `-Toolbar`. This block is declared after the control-bar
       rule above and carries equal specificity, so without the exclusion it
       wins and repaints the top bar with the wrong background plus stray
       rounded corners. Keep the exclusions in sync with the grouped
       selector on the -EditorControlBar rule. */
    [class*="-Toolbar"]:not([class*="-ToolbarContainer"]):not([class*="-ToolbarSection"]):not([class*="-ToolbarSubSection"]):not([class*="-ToolbarButton"]) {
      background: var(--bg-tint) !important;
      border-bottom: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0 !important;
    }
    [class*="-ToolbarButton"][class*="-Toolbar"] { background: transparent !important; }
    [class*="-Toolbar"] button { color: var(--ink-mute) !important; border-radius: 6px !important; }
    [class*="-Toolbar"] button:hover { color: var(--emerald) !important; background: var(--emerald-soft) !important; }
    [data-slate-editor] {
      background: var(--bg) !important;
      color: var(--ink) !important;
      font-family: var(--font-body) !important;
      font-size: 0.98rem !important;
      line-height: 1.7 !important;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm) !important;
    }

    /* Primary actions: Publish, Save */
    button[class*="-ToolbarButton"],
    [class*="-PublishButton"],
    [class*="-SaveButton"] {
      background: var(--emerald) !important;
      color: #fff !important;
      border: 1px solid var(--emerald) !important;
      border-radius: 999px !important;
      font-family: var(--font-body) !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      text-transform: none !important;
      padding: 0.6rem 1.3rem !important;
      box-shadow: none !important;
      transition: all 0.3s var(--ease) !important;
    }
    button[class*="-ToolbarButton"]:hover,
    [class*="-PublishButton"]:hover,
    [class*="-SaveButton"]:hover {
      background: var(--emerald-hi) !important;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15,118,110,0.25) !important;
    }
    /* Secondary toolbar controls stay quiet, mirroring .btn.ghost */
    [class*="-ToolbarDropdown"] button[class*="-ToolbarButton"],
    button[class*="-ToolbarButton"][class*="disabled"] {
      background: transparent !important;
      color: var(--ink) !important;
      border-color: var(--line) !important;
    }

    [class*="-StyledModal"],
    [class*="-MediaLibraryModal"],
    [class*="-DialogContent"] {
      background: var(--bg) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius) !important;
      box-shadow: 0 24px 64px rgba(28,28,28,0.16) !important;
      color: var(--ink) !important;
      /* No overflow:hidden here. Decap owns the scroll container inside the
         media library, and clipping it at the modal cuts the image grid off
         once the uploads pass one screenful. The card grid is
         transparent-backed, so nothing bleeds past the rounded corners. */
    }
    [class*="-MediaLibraryTitle"],
    [class*="-StyledModal"] h1 {
      font-family: var(--font-heading) !important;
      font-weight: 700 !important;
      letter-spacing: -0.02em !important;
      color: var(--ink) !important;
    }
    [class*="-MediaLibraryCardGrid"] { background: transparent !important; }

      background: var(--bg-elev) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--radius-sm) !important;
      color: var(--ink) !important;
      transition: all 0.25s var(--ease) !important;
    }
    [class*="-MediaCard"]:hover {

    /* Notifications */
    [class*="-Toast"],
    [class*="-SnackbarMessage"] {

      color: var(--ink) !important;

      border-radius: var(--radius-sm) !important;
      box-shadow: 0 12px 32px rgba(28,28,28,0.12) !important;
      font-family: var(--font-body) !important;
    }

    [class*="-Loader"] { color: var(--ink-mute) !important; }
  </style>

  <script>

        /* shared small parts */

        '.count{font-size:.75rem;color:var(--ink-faint);margin-left:.4rem;font-weight:400}',
      ].join(''));

      /* ============================================================
         PREVIEW TEMPLATES

         Both collections contain files named meta / nav / hero / about /
         contact, and Decap keys templates by file name, so one dispatcher
         is registered for every name and it branches on the collection.
         ============================================================ */
      var h = window.h || (window.React && window.React.createElement);
      if (!h) return;

      /* Keys are positional, not monotonic. `k` used to only ever increment,
         so every render handed React an all-new key set and it tore down and
         rebuilt the whole preview subtree on each keystroke: flicker, image
         re-fetches, lost scroll position. Resetting per render makes a given
         node keep its key across renders, because the render pass is
         synchronous and top-down, so the call order is stable. Toggling a
         conditional node still shifts its later siblings by one, same as
         index keys in a list, which is the acceptable case. */
      var k = 0;
      var key = function () { return 'k' + (++k); };
      var resetKeys = function () { k = 0; };

      /** Immutable-safe read that always hands back plain JS. */
      function js(v) { return v && v.toJS ? v.toJS() : v; }

      function txt(v) {
        if (v == null) return '';
        if (typeof v === 'string' || typeof v === 'number') return String(v);
        if (typeof v === 'object') return v.label || v.title || v.name || v.text || '';
        return String(v);
      }

      function list(v) {
        var a = js(v);
        return Array.isArray(a) ? a : [];
      }

      function em(node, fallback) {
        return node ? node : h('span', { className: 'empty' }, fallback);
      }

      /** Resolve a media path through Decap so uploads preview before publish. */
      function media(props, path) {
        if (!path) return null;
        try {
          var a = props.getAsset && props.getAsset(path);
          if (a) return a.toString();
        } catch (e) {}
        return path;
      }

      function eyebrowTitleSub(d, extra) {
        var out = [];
        if (d.eyebrow) out.push(h('p', { className: 'sec-eyebrow', key: key() }, d.eyebrow));
        var t = d.title || d.heading;
        if (t) out.push(h('h1', { className: 'sec-title', key: key() }, t));
        var s = d.subtitle || d.subheading || d.description;
        if (s) out.push(h('p', { className: 'sec-sub', key: key() }, s));
        return out.concat(extra || []);
      }

      function buttons(items) {
        if (!items.length) return null;
        return h('div', { className: 'btns', key: key() }, items.map(function (b) {
          var style = (b && b.style) || 'ghost';
          return h('span', { className: 'btn ' + (style === 'primary' ? 'primary' : 'ghost'), key: key() },
            txt(b) || 'Button',
            b && b.new_tab ? h('span', { className: 'cue' }, '↗') : null
          );
        }));
      }

      /* ---------------------------------------- engineering renderers --- */

      var E = {};

      E.meta = function (d) {
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Browser tab'),
          h('div', { className: 'tabchip' },
            h('span', { className: 'fav' }),
            d.title || 'Untitled page'
          ),
          h('hr', { className: 'sec-rule' }),
          h('p', { className: 'sec-eyebrow' }, 'Search result'),
          h('div', { className: 'serp' },
            h('p', { className: 'url' }, 'www.edwingyasi.online'),
            h('p', { className: 't' }, d.title || 'Untitled page'),
            h('p', { className: 'd' }, em(d.description, 'No description set. Search engines will pick their own snippet.'))
          )
        );
      };

      E.nav = function (d) {
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Navigation'),
          h('div', { className: 'navbar' },
            h('span', { className: 'brand' }, d.brand || 'Brand'),
            h('span', { className: 'links' }, list(d.links).map(function (l) {
              return h('span', { key: key() }, txt(l));
            })),
            h('span', { className: 'cta' }, d.cta_label || 'CTA')
          )
        );
      };

      E.hero = function (d) {
        var roles = list(d.roles).map(txt).filter(Boolean);
        return h('div', {},
          roles.length
            ? h('p', { className: 'hero-tag' }, h('span', { className: 'dot' }), roles[0])
            : null,
          h('h1', { className: 'hero-title' }, em(d.headline, 'Headline')),
          roles.length > 1
            ? h('p', { className: 'hero-role' }, roles.slice(1).join('  ·  '))
            : null,
          h('p', { className: 'hero-sub' }, em(d.subline, 'Sub-headline')),
          buttons(list(d.buttons))
        );
      };

      E.about = function (d) {
        var stats = list(d.stats);
        return h('div', {},
          eyebrowTitleSub(d),
          h('div', { className: 'prose' }, list(d.paragraphs).map(function (p) {
            return h('p', { key: key(), dangerouslySetInnerHTML: { __html: txt(p) } });
          })),
          stats.length
            ? h('div', { className: 'stats' }, stats.map(function (s) {
                return h('div', { className: 'stat', key: key() },
                  h('p', { className: 'n' }, s.number, s.plus ? h('span', { className: 'plus' }, '+') : null),
                  h('p', { className: 'lbl' }, s.label_line_1, s.label_line_2 ? h('br') : null, s.label_line_2)
                );
              }))
            : null
        );
      };

      E.projects = function (d, props) {
        var strip = js(d.eon_strip) || {};
        return h('div', {},
          eyebrowTitleSub(d),
          h('div', { className: 'cards' }, list(d.items).map(function (p) {
            var src = media(props, p.image);
            return h('div', { className: 'project-card', key: key() },
              h('div', { className: 'project-visual' },
                src ? h('img', { src: src, alt: p.image_alt || '' }) : 'No image'
              ),
              p.category ? h('p', { className: 'project-cat' }, h('span', { className: 'pin' }), p.category) : null,
              h('h3', { className: 'project-title' }, em(p.title, 'Untitled project')),
              h('p', { className: 'project-desc' }, p.description || ''),
              list(p.tools).length
                ? h('div', { className: 'project-tools' }, list(p.tools).map(function (t) {
                    return h('span', { key: key() }, txt(t));
                  }))
                : null,
              h('p', { className: 'project-arrow' }, (p.link_label || 'View project') + ' →')
            );
          })),
          strip.enabled !== false && (strip.title || strip.description)
            ? h('div', { className: 'eon-strip' },
                strip.eyebrow ? h('p', { className: 'sec-eyebrow' }, strip.eyebrow) : null,
                h('h3', { className: 'eon-title' }, strip.title || ''),
                h('p', { className: 'eon-desc' }, strip.description || ''),
                h('p', { className: 'eon-link' }, (strip.link_label || 'Visit') + ' →')
              )
            : null
        );
      };

      E.skills = function (d) {
        return h('div', {},
          eyebrowTitleSub(d),
          list(d.blocks).map(function (b) {
            var theme = (b.theme || 'emerald').toLowerCase();
            return h('div', { className: 'skill-block ' + theme, key: key() },
              h('h3', {}, em(b.heading, 'Untitled block')),
              b.note ? h('p', { className: 'skill-note' }, b.note) : null,
              h('div', { className: 'badges' }, list(b.badges).map(function (x) {
                return h('span', { className: 'badge', key: key() }, txt(x));
              }))
            );
          })
        );
      };

      E.experience = function (d) {
        return h('div', {},
          eyebrowTitleSub(d),
          h('div', { className: 'timeline' }, list(d.entries).map(function (e) {
            return h('div', { className: 'exp', key: key() },
              h('p', { className: 'exp-date' }, e.date || ''),
              h('h3', { className: 'exp-role' }, em(e.role, 'Role')),
              h('p', { className: 'exp-org' }, e.org || ''),
              h('p', { className: 'exp-desc' }, e.description || '')
            );
          }))
        );
      };

      E.contact = function (d) {
        return h('div', {},
          h('h1', { className: 'sec-title' }, em(d.title, 'Contact')),
          h('p', { className: 'sec-sub' }, d.intro || ''),
          buttons(list(d.links))
        );
      };

      E.footer = function (d) {
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Footer'),
          h('div', { className: 'footer' },
            h('p', { className: 'fb' }, em(d.brand, 'Brand')),
            h('p', { className: 'fn' }, d.note || ''),
            h('div', { className: 'socials' }, list(d.socials).map(function (s) {
              return h('span', { key: key() }, txt(s) || s.network || 'Link');
            }))
          )
        );
      };

      /* ------------------------------------------ eon designs renderers --
         That site is near-black, so its previews sit on a dark stage. The
         panel around them stays light. */

      var D = {};

      function stage(children) {
        return h('div', { className: 'eon-stage' }, children);
      }

      D.meta = function (d, props) {
        var logo = media(props, d.logo);
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Browser tab'),
          h('div', { className: 'tabchip' }, h('span', { className: 'fav' }), d.title || 'Untitled page'),
          h('hr', { className: 'sec-rule' }),
          h('p', { className: 'sec-eyebrow' }, 'Link preview'),
          stage([
            logo ? h('img', { key: key(), src: logo, style: { height: '28px', width: 'auto', marginBottom: '14px' } }) : null,
            h('h3', { key: key() }, d.og_title || d.title || 'Untitled'),
            h('p', { key: key() }, em(d.og_description, 'No share description set.')),
            d.og_url ? h('p', { key: key(), className: 'kick' }, d.og_url) : null,
          ])
        );
      };

      D.nav = function (d) {
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Navigation'),
          stage([
            h('div', { key: key(), className: 'chips' },
              list(d.links).map(function (l) { return h('span', { key: key() }, txt(l)); })
            ),
            h('p', { key: key(), style: { marginTop: '14px' } },
              h('span', { className: 'btn' }, d.cta_label || 'CTA')
            ),
          ])
        );
      };

      D.hero = function (d) {
        return h('div', {},
          stage([
            d.badge ? h('p', { key: key(), className: 'kick' }, d.badge) : null,
            h('h2', { key: key() }, em(d.headline, 'Headline')),
            h('p', { key: key() },
              d.subline_line_1 || '',
              h('br'),
              d.subline_line_2_before || '',
              d.subline_emphasis ? h('span', { className: 'em' }, d.subline_emphasis) : null,
              d.subline_line_2_after || ''
            ),
            h('p', { key: key() },
              h('span', { className: 'btn' }, d.primary_button || 'Primary'),
              ' ',
              h('span', { className: 'btn o' }, d.secondary_button || 'Secondary')
            ),
          ])
        );
      };

      D.works = function (d, props) {
        var items = list(d.items);
        return h('div', {},
          stage([
            h('h2', { key: key() }, em(d.heading, 'Selected works')),
            d.subheading ? h('p', { key: key() }, d.subheading) : null,
            d.counter ? h('p', { key: key(), className: 'kick' }, d.counter) : null,
            h('div', { key: key(), className: 'grid' }, items.map(function (w) {
              var src = media(props, w.image);
              return h('div', { className: 'tile', key: key() },
                h('div', { className: 'ph' }, src ? h('img', { src: src, alt: w.title || '' }) : 'No image'),
                h('div', { className: 'cap' },
                  h('b', {}, w.title || 'Untitled'),
                  h('i', {}, [w.category, w.year].filter(Boolean).join(' · '))
                )
              );
            })),
          ])
        );
      };

      D.vault = function (d, props) {
        var items = list(d.items);
        return h('div', {},
          stage([
            d.eyebrow ? h('p', { key: key(), className: 'kick' }, d.eyebrow) : null,
            h('h2', { key: key() }, em(d.heading, 'The Vault')),
            d.description ? h('p', { key: key() }, d.description) : null,
            h('div', { key: key(), className: 'grid' }, items.slice(0, 6).map(function (v) {
              var src = media(props, v.src);
              return h('div', { className: 'tile', key: key() },
                h('div', { className: 'ph' }, src ? h('img', { src: src, alt: v.title || '' }) : 'No image'),
                h('div', { className: 'cap' },
                  h('b', {}, v.title || 'Untitled'),
                  h('i', {}, v.category || '')
                )
              );
            })),
            items.length > 6
              ? h('p', { key: key(), className: 'kick', style: { marginTop: '14px' } },
                  '+ ' + (items.length - 6) + ' more in the archive')
              : null,
          ])
        );
      };

      D.about = function (d, props) {
        var img = media(props, d.image) || media(props, d.image_fallback);
        return h('div', {},
          stage([
            d.eyebrow ? h('p', { key: key(), className: 'kick' }, d.eyebrow) : null,
            h('h2', { key: key() }, d.heading_line_1 || '', d.heading_line_2 ? h('br') : null, d.heading_line_2 || ''),
            img ? h('div', { key: key(), className: 'tile', style: { marginBottom: '14px' } },
              h('div', { className: 'ph' }, h('img', { src: img, alt: '' }))) : null,
            h('div', { key: key() }, list(d.paragraphs).map(function (p) {
              return h('p', { key: key() }, txt(p));
            })),
            d.capabilities_heading ? h('p', { key: key(), className: 'kick' }, d.capabilities_heading) : null,
            h('div', { key: key(), className: 'chips' }, list(d.capabilities).map(function (c) {
              return h('span', { key: key() }, txt(c));
            })),
            d.clients_heading ? h('p', { key: key(), className: 'kick', style: { marginTop: '16px' } }, d.clients_heading) : null,
            h('div', { key: key(), className: 'chips' }, list(d.clients).map(function (c) {
              return h('span', { key: key() }, txt(c));
            })),
          ])
        );
      };

      D.journal = function (d, props) {
        return h('div', {},
          stage([
            h('h2', { key: key() }, em(d.heading, 'Journal')),
            h('div', { key: key() }, list(d.posts).map(function (p) {
              var src = media(props, p.image);
              return h('div', { key: key(), style: { marginBottom: '18px' } },
                src ? h('div', { className: 'tile' }, h('div', { className: 'ph' }, h('img', { src: src, alt: '' }))) : null,
                h('h3', { style: { marginTop: '10px' } }, p.title || 'Untitled post'),
                p.date ? h('p', { className: 'kick' }, p.date) : null,
                h('p', {}, p.excerpt || '')
              );
            })),
          ])
        );
      };

      D.contact = function (d) {
        return h('div', {},
          stage([
            h('h2', { key: key() },
              d.heading_line_1 || '',
              d.heading_emphasis ? h('span', { className: 'em' }, ' ' + d.heading_emphasis) : null
            ),
            d.email ? h('p', { key: key() }, d.email) : null,
            h('div', { key: key(), className: 'chips' },
              [d.name_placeholder, d.email_placeholder, d.message_placeholder]
                .filter(Boolean)
                .map(function (p) { return h('span', { key: key() }, p); })
            ),
            h('p', { key: key(), style: { marginTop: '14px' } },
              h('span', { className: 'btn' }, d.submit_label || 'Send')
            ),
            h('div', { key: key(), className: 'chips' }, list(d.socials).map(function (s) {
              return h('span', { key: key() }, s.network || txt(s));
            })),
            d.footer ? h('p', { key: key(), className: 'kick', style: { marginTop: '16px' } }, d.footer) : null,
          ])
        );
      };

      /* -------------------------------------------------- fallback + wire */

      function Fallback(d) {
        return h('div', {},
          h('p', { className: 'sec-eyebrow' }, 'Preview'),
          h('div', { className: 'prose' }, Object.keys(d).map(function (name) {
            var v = d[name];
            return h('p', { key: key() },
              h('strong', {}, name.replace(/_/g, ' ') + ': '),
              Array.isArray(js(v)) ? list(v).length + ' item(s)' : txt(v) || '—'
            );
          }))
        );
      }

      function Preview(props) {
        resetKeys();
        var data = js(props.entry.get('data')) || {};
        var collection = props.collection.get('name');
        var slug = props.entry.get('slug') || '';
        var table = collection === 'designs' ? D : E;
        var render = table[slug] || table[collection] || Fallback;
        try {
          return render(data, props);
        } catch (err) {
          return h('div', { className: 'prose' },
            h('p', {}, h('strong', {}, 'Preview unavailable. ')),
            h('p', {}, String(err && err.message ? err.message : err))
          );
        }
      }

      [
        'meta', 'nav', 'hero', 'about', 'projects', 'skills',
        'experience', 'contact', 'footer', 'works', 'vault', 'journal',
        'engineering', 'designs',
      ].forEach(function (name) {
        try { CMS.registerPreviewTemplate(name, Preview); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
